name: plant_flower_mobile
description: Flutter customer application for Plant & Flower Shop.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  plant_flower_shared: ^0.1.0
  plant_flower_api_client: ^0.1.0
  plant_flower_ui: ^0.1.0
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/auth/
    - assets/home/
    - assets/checkout/
    - assets/notifications/
