name: Backend CI

on:
  push:
    paths:
      - "apps/backend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plant_flower_shop
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/plant_flower_shop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @plant-flower/backend
      - run: pnpm prisma:generate
      - run: pnpm prisma:validate
      - run: pnpm --filter @plant-flower/backend typecheck:seed
      - run: pnpm typecheck:backend
      - run: pnpm build:backend

  docker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
