name: Flutter CI

on:
  push:
    paths:
      - "apps/mobile/**"
      - "apps/admin/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/admin/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Melos
        run: dart pub global activate melos ^7.0.0
      - name: Bootstrap workspace
        run: melos bootstrap
      - name: Analyze
        run: melos run analyze
      - name: Test
        run: melos run test
