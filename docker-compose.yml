services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: plant_flower_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plant_flower_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Migration bật pgvector và tạo index RAG trước khi backend nhận request.
    command: sh -c "./node_modules/.bin/prisma migrate deploy && node dist/server.js"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/plant_flower_shop
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/plant_flower_shop
      # Auth still verifies tokens against a real Supabase project.
      SUPABASE_URL: ${SUPABASE_URL:-https://example.supabase.co}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-local-development-key}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-local-development-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "5000:5000"

volumes:
  postgres_data:
